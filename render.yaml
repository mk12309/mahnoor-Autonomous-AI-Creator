services:
  - type: web
    name: signalforge-ai-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BREETH_API_KEY
        sync: false
      - key: BREETH_BASE_URL
        value: https://api.thebreeth.com
      - key: PUBLISH_INTERVAL_MINUTES
        value: 30
      - key: RELEVANCE_THRESHOLD
        value: 70
      - key: AGENT_CRON_INTERVAL
        value: "*/30 * * * *"
